<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loom & Lane | Customer Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #0f172a 100%);
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 70%);
      top: -200px;
      right: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 70%);
      bottom: -150px;
      left: -100px;
      pointer-events: none;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .login-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: fadeUp 0.6s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }
    .login-brand-mark {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 800;
      font-size: 22px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(16,185,129,0.4);
    }
    .login-brand h1 {
      font-size: 22px;
      font-weight: 800;
      color: #f1f5f9;
      letter-spacing: -0.3px;
    }
    .login-brand p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Tab Switcher */
    .tab-switcher {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 2px 10px rgba(16,185,129,0.3);
    }
    .tab-btn:not(.active):hover {
      color: #e2e8f0;
      background: rgba(148, 163, 184, 0.1);
    }

    /* Tab Content */
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-title {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .login-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      background: rgba(15, 23, 42, 0.5);
      color: #f1f5f9;
      font-family: inherit;
    }
    .form-group input::placeholder { color: #475569; }
    .form-group input:focus, .form-group select:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
      background: rgba(15, 23, 42, 0.8);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .login-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .login-error.visible { display: block; }
    .login-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .login-success.visible { display: block; }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(16,185,129,0.3);
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16,185,129,0.4); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
    .login-footer a {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
    }
    .login-footer a:hover { text-decoration: underline; }
    .login-hint {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: #6ee7b7;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .login-hint code {
      background: rgba(16, 185, 129, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-mark">L</div>
        <div>
          <h1>Loom & Lane</h1>
          <p>Customer Portal</p>
        </div>
      </div>

      <!-- Tab Switcher -->
      <div class="tab-switcher">
        <button class="tab-btn active" data-tab="signin" id="signinTab">Sign In</button>
        <button class="tab-btn" data-tab="register" id="registerTab">Create Account</button>
      </div>

      <!-- Sign In Tab -->
      <div class="tab-content active" id="signinContent">
        <h2 class="login-title">Welcome back</h2>
        <p class="login-subtitle">Enter the email and phone linked to your Loom & Lane account.</p>

        <div class="login-hint">
          <strong>Demo:</strong> Try <code>aanya@loomandlane.com</code> with phone <code>+91 90000 10001</code>
        </div>

        <div class="login-error" id="loginError"></div>

        <form id="customerLoginForm" autocomplete="on">
          <div class="form-group">
            <label for="loginEmail">Email address</label>
            <input type="email" id="loginEmail" name="email" placeholder="yourname@example.com" required autofocus>
          </div>
          <div class="form-group">
            <label for="loginPhone">Phone number</label>
            <input type="tel" id="loginPhone" name="phone" placeholder="+91 90000 10001" required>
          </div>
          <button type="submit" class="login-btn" id="loginBtn">Access My Portal</button>
        </form>
      </div>

      <!-- Register Tab -->
      <div class="tab-content" id="registerContent">
        <h2 class="login-title">Create your account</h2>
        <p class="login-subtitle">Join Loom & Lane and get 100 welcome loyalty points instantly!</p>

        <div class="login-error" id="registerError"></div>
        <div class="login-success" id="registerSuccess"></div>

        <form id="customerRegisterForm" autocomplete="on">
          <div class="form-group">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" name="name" placeholder="Aanya Sharma" required>
          </div>
          <div class="form-group">
            <label for="regEmail">Email address</label>
            <input type="email" id="regEmail" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="regPhone">Phone number</label>
              <input type="tel" id="regPhone" name="phone" placeholder="+91 98765 43210" required>
            </div>
            <div class="form-group">
              <label for="regCity">City</label>
              <input type="text" id="regCity" name="city" placeholder="Mumbai">
            </div>
          </div>
          <div class="form-group">
            <label for="regAddress">Address (optional)</label>
            <input type="text" id="regAddress" name="address" placeholder="123, Example Street">
          </div>
          <button type="submit" class="login-btn" id="registerBtn">Create Account & Get 100 Points 🎉</button>
        </form>
      </div>

      <div class="login-footer">
        Admin? <a href="/login.html">Sign in to the dashboard</a>
      </div>
    </div>
  </div>
  <script src="/customer-login.js"></script>
</body>
</html>
